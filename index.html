<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>远程教育理论探索 · 完整交互学习平台</title>
    <style>
        :root {
            --bg-deep: #060d1f; --bg-dark: #0a1628; --bg-mid: #0d2137;
            --blue-deep: #0d2137; --blue-mid: #1a3a5c; --blue-light: #1e5799;
            --blue-bright: #2989d8; --blue-accent: #4a9eff; --blue-glow: #6bb5ff;
            --blue-pale: #a8d4ff; --text-white: #f0f7ff; --text-light: #c8dff5;
            --text-muted: #8ab4d8; --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12); --card-radius: 18px;
            --font-sans: 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
            --color-distance: #3b82f6; --color-learning: #8b5cf6;
            --color-instructional: #06b6d4; --color-community: #f59e0b;
            --color-correct: #22c55e; --color-wrong: #ef4444;
            --sidebar-width: 220px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-sans);
            background: linear-gradient(160deg, #060d1f 0%, #0a1628 20%, #0d2137 40%, #122b4a 60%, #0d2137 80%, #060d1f 100%);
            color: var(--text-white); min-height: 100vh; overflow-x: hidden;
            position: relative; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
        }
        .particles-container { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden; transition:opacity .5s; }
        .particles-container.hidden { opacity:0; pointer-events:none; }
        .particle { position:absolute; border-radius:50%; background:radial-gradient(circle, rgba(107,181,255,.5), rgba(74,158,255,.2) 40%, transparent 70%); animation:floatParticle 12s ease-in-out infinite; }
        .particle:nth-child(1){width:8px;height:8px;left:5%;top:15%;animation-duration:10s;opacity:.45;}
        .particle:nth-child(2){width:12px;height:12px;left:15%;top:60%;animation-duration:14s;animation-delay:1s;opacity:.35;}
        .particle:nth-child(3){width:6px;height:6px;left:25%;top:30%;animation-duration:9s;animation-delay:2s;opacity:.5;}
        .particle:nth-child(4){width:10px;height:10px;left:35%;top:75%;animation-duration:16s;opacity:.3;}
        .particle:nth-child(5){width:7px;height:7px;left:45%;top:20%;animation-duration:11s;animation-delay:3s;opacity:.4;}
        .particle:nth-child(6){width:14px;height:14px;left:55%;top:50%;animation-duration:18s;opacity:.25;}
        .particle:nth-child(7){width:5px;height:5px;left:65%;top:10%;animation-duration:8s;opacity:.5;}
        .particle:nth-child(8){width:9px;height:9px;left:75%;top:40%;animation-duration:13s;opacity:.35;}
        .particle:nth-child(9){width:11px;height:11px;left:85%;top:70%;animation-duration:15s;opacity:.3;}
        .particle:nth-child(10){width:6px;height:6px;left:92%;top:25%;animation-duration:10s;opacity:.45;}
        @keyframes floatParticle{0%,100%{transform:translateY(0) scale(1);opacity:.35;}25%{transform:translateY(-35px) scale(1.15);opacity:.55;}50%{transform:translateY(-60px) scale(.9);opacity:.3;}75%{transform:translateY(-25px) scale(1.05);opacity:.5;}}
        .glow-orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(80px);animation:glowPulse 6s ease-in-out infinite;}
        .glow-orb-1{width:400px;height:400px;background:rgba(30,87,153,.25);top:-100px;left:-100px;}
        .glow-orb-2{width:500px;height:500px;background:rgba(10,22,40,.5);bottom:-150px;right:-150px;animation-delay:3s;}
        .glow-orb-3{width:300px;height:300px;background:rgba(41,137,216,.2);top:40%;left:60%;animation-delay:1.5s;}
        @keyframes glowPulse{0%,100%{transform:scale(1);opacity:.7;}50%{transform:scale(1.15);opacity:1;}}

        .login-section{position:fixed;top:0;left:0;width:100%;height:100%;z-index:500;display:flex;align-items:center;justify-content:center;background:rgba(6,13,31,.97);backdrop-filter:blur(10px);transition:opacity .6s,visibility .6s;}
        .login-section.hidden{opacity:0;visibility:hidden;pointer-events:none;}
        .login-card{background:linear-gradient(160deg,rgba(18,43,74,.95),rgba(10,22,40,.98));border:1px solid var(--glass-border);border-radius:24px;padding:40px 36px;width:90%;max-width:420px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);}
        .login-card h2{font-size:1.7rem;font-weight:800;margin-bottom:6px;background:linear-gradient(135deg,#fff,#4a9eff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .login-card p{font-size:.9rem;color:var(--text-muted);margin-bottom:24px;}
        .login-input-group{margin-bottom:16px;text-align:left;}
        .login-input-group label{font-size:.8rem;font-weight:600;color:var(--text-light);display:block;margin-bottom:6px;}
        .login-input-group input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--glass-border);background:rgba(255,255,255,.08);color:var(--text-white);font-size:.95rem;font-family:var(--font-sans);outline:none;}
        .login-input-group input:focus{border-color:var(--blue-accent);box-shadow:0 0 20px rgba(74,158,255,.2);}
        .btn-login{width:100%;padding:14px;border-radius:12px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--blue-bright),var(--blue-accent));color:#fff;font-size:1rem;font-weight:700;letter-spacing:1px;transition:all .3s;font-family:var(--font-sans);margin-top:8px;box-shadow:0 4px 20px rgba(41,137,216,.4);}
        .btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(41,137,216,.5);}
        .login-error{color:var(--color-wrong);font-size:.8rem;margin-top:10px;min-height:20px;}

        .app-layout{display:flex;min-height:100vh;position:relative;z-index:1;}
        .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-width);background:rgba(6,13,31,.92);backdrop-filter:blur(18px);border-right:1px solid var(--glass-border);z-index:100;display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto;transition:transform .4s;}
        .sidebar-brand{display:flex;align-items:center;gap:10px;font-size:1rem;font-weight:700;color:var(--text-white);margin-bottom:24px;padding:6px 8px;user-select:none;cursor:default;}
        .sidebar-brand .brand-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--blue-bright),var(--blue-accent));display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
        .sidebar-nav{display:flex;flex-direction:column;gap:6px;flex:1;}
        .sidebar-btn{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid transparent;color:var(--text-muted);cursor:pointer;font-size:.85rem;font-weight:600;transition:all .3s;font-family:var(--font-sans);text-align:left;white-space:nowrap;}
        .sidebar-btn:hover{background:rgba(255,255,255,.1);color:var(--text-white);}
        .sidebar-btn.active{background:linear-gradient(135deg,rgba(41,137,216,.3),rgba(30,87,153,.2));border-color:rgba(74,158,255,.4);color:var(--blue-pale);}
        .sidebar-btn .icon{font-size:1.1rem;}
        .sidebar-user{margin-top:12px;padding:12px;background:rgba(255,255,255,.05);border-radius:12px;text-align:center;font-size:.7rem;color:var(--text-muted);}
        .sidebar-user strong{color:var(--blue-pale);font-size:.8rem;display:block;margin-bottom:2px;}

        .main-content{margin-left:var(--sidebar-width);flex:1;padding:20px 28px;position:relative;z-index:1;}
        .main-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--glass-border);}
        .main-header h1{font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,#fff,#4a9eff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
        .search-container{display:flex;align-items:center;background:rgba(255,255,255,.08);border:1px solid var(--glass-border);border-radius:99px;padding:4px 12px;transition:all .3s;width:200px;max-width:200px;}
        .search-container:focus-within{border-color:rgba(74,158,255,.5);box-shadow:0 0 20px rgba(74,158,255,.2);background:rgba(255,255,255,.12);width:250px;max-width:250px;}
        .search-icon{font-size:1rem;margin-right:6px;opacity:.7;}
        .search-input{flex:1;background:transparent;border:none;outline:none;color:var(--text-white);font-size:.85rem;padding:6px 0;font-family:var(--font-sans);min-width:0;}
        .search-input::placeholder{color:var(--text-muted);opacity:.6;}
        .search-clear{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;display:none;}
        .search-clear.visible{display:block;}
        .btn-reset,.btn-particle-toggle{background:rgba(255,255,255,.08);border:1px solid var(--glass-border);color:var(--text-light);padding:7px 14px;border-radius:99px;cursor:pointer;font-size:.78rem;font-weight:600;transition:all .3s;font-family:var(--font-sans);white-space:nowrap;}
        .btn-reset:hover,.btn-particle-toggle:hover{background:rgba(255,255,255,.15);color:var(--text-white);}
        .btn-particle-toggle.active{background:rgba(74,158,255,.2);border-color:rgba(74,158,255,.4);color:var(--blue-pale);}

        .stats-bar{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:20px;}
        .stat-card{flex:1;min-width:120px;background:rgba(255,255,255,.06);border:1px solid var(--glass-border);border-radius:14px;padding:14px 18px;text-align:center;}
        .stat-card .stat-value{font-size:1.6rem;font-weight:800;color:var(--blue-accent);}
        .stat-card .stat-label{font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;}

        .panel{display:none;animation:fadeInUp .4s ease both;}
        .panel.active{display:block;}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);}}

        .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;perspective:1200px;}
        .card-wrapper{animation:fadeInUp .5s ease both;}
        .card-wrapper.hidden-card{display:none;}
        .card-wrapper.learned .card-front .learned-badge{opacity:1;transform:translateX(-50%) scale(1);}
        .card{position:relative;width:100%;height:360px;cursor:pointer;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,0,.2,1);border-radius:var(--card-radius);will-change:transform;}
        .card.flipped{transform:rotateY(180deg);}
        .card:hover:not(.flipped){transform:translateY(-4px);}
        .card-front,.card-back{position:absolute;top:0;left:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--card-radius);overflow:hidden;border:1px solid var(--glass-border);box-shadow:0 8px 25px rgba(0,0,0,.25);}
        .category-stripe{position:absolute;top:0;left:0;right:0;height:4px;z-index:3;}
        .card-wrapper[data-category="distance"] .category-stripe{background:var(--color-distance);}
        .card-wrapper[data-category="learning"] .category-stripe{background:var(--color-learning);}
        .card-wrapper[data-category="instructional"] .category-stripe{background:var(--color-instructional);}
        .card-wrapper[data-category="community"] .category-stripe{background:var(--color-community);}
        .card-front{background:linear-gradient(160deg,rgba(18,43,74,.92),rgba(10,22,40,.98));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 16px;text-align:center;position:relative;}
        .card-front::before{content:'';position:absolute;top:4px;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--blue-accent),var(--blue-glow),var(--blue-accent),transparent);opacity:.7;z-index:2;}
        .card-number{position:absolute;top:12px;left:14px;font-size:.68rem;font-weight:700;color:var(--text-muted);}
        .card-category-badge{position:absolute;top:10px;right:10px;font-size:.58rem;font-weight:600;padding:3px 8px;border-radius:99px;background:rgba(41,137,216,.2);color:var(--blue-pale);border:1px solid rgba(41,137,216,.3);}
        .card-icon{font-size:2.5rem;margin-bottom:10px;filter:drop-shadow(0 4px 12px rgba(74,158,255,.4));}
        .card-title{font-size:1rem;font-weight:700;color:var(--text-white);margin-bottom:3px;}
        .card-author{font-size:.75rem;color:var(--text-muted);font-weight:500;}
        .card-tagline{font-size:.7rem;color:var(--text-light);margin-top:8px;opacity:.8;line-height:1.4;}
        .learned-badge{position:absolute;bottom:10px;left:50%;transform:translateX(-50%) scale(0);background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;padding:4px 12px;border-radius:99px;font-size:.62rem;font-weight:700;opacity:0;transition:all .4s cubic-bezier(.34,1.56,.64,1);z-index:2;}
        .card-back{background:linear-gradient(160deg,#f8fbff,#e8f0fa 40%,#d4e4f5);transform:rotateY(180deg);display:flex;flex-direction:column;padding:16px 14px;color:#1a2a3a;overflow-y:auto;scrollbar-width:thin;}
        .card-back-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
        .card-back-header .back-icon{font-size:1.4rem;}
        .card-back-header .back-title{font-size:.9rem;font-weight:700;color:#0d2137;}
        .card-back-header .back-author{font-size:.68rem;color:#4a6a8a;}
        .card-back-description{font-size:.72rem;color:#2a3a4a;line-height:1.5;margin-bottom:8px;}
        .card-back-concepts{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
        .concept-tag{background:rgba(30,87,153,.1);border:1px solid rgba(30,87,153,.2);color:#1e5799;font-size:.62rem;font-weight:600;padding:3px 7px;border-radius:99px;}
        .card-back-application{font-size:.68rem;color:#3a5a7a;line-height:1.4;font-style:italic;border-left:3px solid var(--blue-accent);padding-left:8px;margin-bottom:6px;}
        .card-back-study-time{font-size:.65rem;color:#4a6a8a;background:rgba(255,255,255,.5);border-radius:6px;padding:4px 8px;margin-bottom:6px;}
        .btn-view-detail,.btn-mark-learned{padding:6px 12px;border-radius:99px;cursor:pointer;font-size:.65rem;font-weight:700;font-family:var(--font-sans);border:none;margin-bottom:4px;transition:all .3s;display:inline-block;}
        .btn-view-detail{background:linear-gradient(135deg,var(--blue-bright),var(--blue-accent));color:#fff;}
        .btn-view-detail:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(41,137,216,.4);}
        .btn-mark-learned{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;}
        .btn-mark-learned:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(34,197,94,.4);}
        .btn-mark-learned:disabled{background:#6b7280;cursor:not-allowed;transform:none;}
        .card-back-note textarea{width:100%;background:rgba(255,255,255,.7);border:1px solid rgba(30,87,153,.25);border-radius:6px;padding:6px 8px;font-size:.68rem;font-family:var(--font-sans);color:#1a2a3a;resize:vertical;min-height:35px;}
        .btn-save-note{background:linear-gradient(135deg,var(--blue-bright),var(--blue-accent));border:none;color:#fff;padding:4px 10px;border-radius:99px;cursor:pointer;font-size:.62rem;font-weight:700;font-family:var(--font-sans);margin-top:3px;}
        .note-saved-indicator{font-size:.62rem;color:#22c55e;opacity:0;transition:opacity .4s;display:inline-block;margin-left:6px;}
        .note-saved-indicator.show{opacity:1;}

        /* 匹配挑战布局 */
        .match-layout { display: flex; gap: 20px; align-items: flex-start; }
        .match-main { flex: 2; }
        .match-record { flex: 1; min-width: 220px; background: rgba(255,255,255,.06); border: 1px solid var(--glass-border); border-radius: 14px; padding: 16px; }
        .match-record h3 { font-size: 1rem; font-weight: 700; color: var(--blue-pale); margin-bottom: 12px; text-align: center; }
        .match-record-list { display: flex; flex-direction: column; gap: 8px; }
        .match-record-item { background: rgba(255,255,255,.04); border-radius: 8px; padding: 8px 12px; font-size: .8rem; display: flex; justify-content: space-between; align-items: center; }
        .match-record-item .theory { color: var(--text-white); font-weight: 600; }
        .match-record-item .author { color: var(--text-muted); }
        .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:700px;}
        .match-column-title{font-size:.85rem;font-weight:700;color:var(--text-muted);margin-bottom:8px;letter-spacing:1px;}
        .match-item{background:rgba(255,255,255,.07);border:1px solid var(--glass-border);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--text-white);transition:all .3s;user-select:none;margin-bottom:8px;}
        .match-item:hover{background:rgba(255,255,255,.14);}
        .match-item.selected{background:rgba(74,158,255,.3);border-color:var(--blue-accent);box-shadow:0 0 18px rgba(74,158,255,.3);}
        .match-item.matched{background:rgba(34,197,94,.25);border-color:var(--color-correct);color:#4ade80;pointer-events:none;opacity:.75;}
        .match-item.wrong{background:rgba(239,68,68,.25);border-color:var(--color-wrong);animation:shake .5s ease;}
        @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
        .match-score-bar{font-size:.9rem;font-weight:600;color:var(--blue-pale);margin-bottom:14px;padding:10px;background:rgba(74,158,255,.1);border-radius:12px;max-width:400px;}
        .match-reset-btn{background:rgba(255,255,255,.1);border:1px solid var(--glass-border);color:var(--text-light);padding:8px 20px;border-radius:99px;cursor:pointer;font-size:.8rem;font-weight:600;font-family:var(--font-sans);margin-top:16px;}

        .quiz-layout{display:flex;gap:24px;align-items:flex-start;}
        .quiz-main{flex:2;}
        .leaderboard{flex:1;min-width:240px;background:rgba(255,255,255,.06);border:1px solid var(--glass-border);border-radius:16px;padding:16px;position:sticky;top:80px;}
        .leaderboard h3{font-size:1rem;font-weight:700;color:var(--blue-pale);margin-bottom:12px;text-align:center;}
        .leaderboard-item{background:rgba(255,255,255,.04);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:.82rem;}
        .leaderboard-item .rank{width:30px;height:30px;border-radius:50%;background:rgba(74,158,255,.2);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--blue-accent);}
        .leaderboard-item .score{font-weight:700;color:var(--text-white);}
        .leaderboard-item .detail{font-size:.68rem;color:var(--text-muted);}
        .quiz-container{max-width:100%;}
        .quiz-question{background:rgba(255,255,255,.06);border:1px solid var(--glass-border);border-radius:14px;padding:16px 18px;margin-bottom:12px;}
        .quiz-question-header{font-size:.88rem;font-weight:700;color:var(--text-white);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
        .quiz-question-number{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:rgba(74,158,255,.2);color:var(--blue-accent);font-size:.75rem;font-weight:700;flex-shrink:0;}
        .quiz-options{display:flex;flex-direction:column;gap:5px;}
        .quiz-option{background:rgba(255,255,255,.05);border:1px solid var(--glass-border);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:.8rem;color:var(--text-light);transition:all .3s;text-align:left;font-family:var(--font-sans);}
        .quiz-option:hover:not(.disabled){background:rgba(255,255,255,.12);color:var(--text-white);}
        .quiz-option.correct{background:rgba(34,197,94,.25);border-color:var(--color-correct);color:#4ade80;}
        .quiz-option.wrong{background:rgba(239,68,68,.2);border-color:var(--color-wrong);color:#fca5a5;}
        .quiz-option.disabled{pointer-events:none;opacity:.7;}
        .quiz-hint{font-size:.72rem;color:#f59e0b;margin-top:6px;padding:6px 10px;background:rgba(245,158,11,.1);border-radius:8px;display:none;}
        .quiz-hint.show{display:block;}
        .quiz-result-bar{text-align:center;font-size:1rem;font-weight:700;color:var(--blue-pale);padding:14px;background:rgba(74,158,255,.1);border-radius:12px;margin-top:14px;}
        .quiz-reset-btn{display:block;margin:12px auto 0;background:rgba(255,255,255,.1);border:1px solid var(--glass-border);color:var(--text-light);padding:8px 20px;border-radius:99px;cursor:pointer;font-size:.8rem;font-weight:600;font-family:var(--font-sans);}
        .timeline-horizontal-wrapper{overflow-x:auto;padding:20px 10px;position:relative;min-height:500px;}
        .timeline-svg-container{position:relative;width:1200px;height:480px;margin:0 auto;}
        .timeline-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
        .timeline-node-item{position:absolute;text-align:center;cursor:pointer;transform:translateX(-50%);z-index:2;}
        .timeline-node-dot{width:20px;height:20px;border-radius:50%;background:var(--blue-accent);border:4px solid var(--blue-mid);box-shadow:0 0 15px rgba(74,158,255,.6);margin:0 auto 6px;}

            {id:2,title:'联通主义学习理论',author:'乔治·西蒙斯',category:'learning',icon:'🕸️',tagline:'学习发生在网络连接之中',description:'数字时代的学习发生在网络中。知识存在于连接之中，学习者通过建立和维护连接来持续学习。',concepts:['网络学习','节点连接','分布式认知','持续学习'],application:'鼓励学习者使用社交媒体建立个人学习网络。',searchText:'联通主义 西蒙斯 网络学习 连接',coreView:'学习是连接专门节点或信息源的过程，知识驻留在网络中。',proposer:'乔治·西蒙斯 (George Siemens)，加拿大教育理论家。',scenarios:'MOOC学习、个人学习环境、社交媒体学习、企业知识管理。',quiz:[{type:'single',question:'联通主义认为知识存在于哪里？',options:['个体头脑中','网络连接中','教科书中','教师的经验中'],answer:1,hint:'知识不在固定位置。'},{type:'multiple',question:'联通主义强调哪些概念？',options:['节点','连接','网络','记忆'],answer:[0,1,2],hint:'关注信息源之间的关联。'},{type:'judge',question:'知道在哪里找知识比知道知识本身更重要。',answer:true,hint:'数字时代信息爆炸。'},{type:'single',question:'联通主义学习理论的核心观点是？',options:['学习发生在网络连接中','学习是刺激反应','学习是知识建构','学习是行为改变'],answer:0,hint:'知识与连接有关。'},{type:'judge',question:'联通主义强调知识的静态存储。',answer:false,hint:'知识是动态、分散的。'},{type:'single',question:'联通主义的提出者是？',options:['乔治·西蒙斯','迈克尔·穆尔','陈丽','兰迪·加里森'],answer:0,hint:'加拿大教育理论家。'},{type:'judge',question:'联通主义适用于传统课堂教学。',answer:false,hint:'更适合数字网络环境。'},{type:'multiple',question:'联通主义中学习者需要建立哪些连接？',options:['与信息源','与专家','与同伴','与自己'],answer:[0,1,2],hint:'建立与他人的网络连接。'},{type:'single',question:'个人学习环境(PLE)基于什么理论？',options:['联通主义','行为主义','认知主义','建构主义'],answer:0,hint:'PLE强调网络连接。'},{type:'judge',question:'联通主义认为学习是终身的过程。',answer:true,hint:'知识不断更新，学习持续进行。'}],videoUrl:'https://www.youtube.com/watch?v=YMcTHndpzYg',docUrl:'https://www.elearnspace.org/'},

        ];

        // ============ 状态 ============
        let learnedTheories = new Set();
        let studyTimes = {};
        let notes = {};
        let particlesEnabled = true;
        let searchQuery = '';
        let hasShownCompletion = false;
        let lastFlipTimestamps = {};
        let currentPanel = 'cards';
        let matchSelected = null;
        let matchScore = 0;
        let quizAttempts = {};
        let quizScore = 0;
        let quizTotal = 0;
        let currentQuizBank = [];
        let leaderboardScores = [];

        const STORAGE_KEY_PROGRESS = 'learning-theories-progress';
        const STORAGE_KEY_NOTES = 'learning-theories-notes';
        const STORAGE_KEY_STUDY_TIME = 'learning-theories-study-times';
        const STORAGE_KEY_PARTICLES = 'particles-enabled';
        const STORAGE_KEY_LEADERBOARD = 'quiz-leaderboard';

        // ============ 音效 ============
        function playSuccessSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = 'sine';
                oscillator.frequency.value = 880;
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.4);
                setTimeout(() => {
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.type = 'sine';
                    osc2.frequency.value = 1175;
                    gain2.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    osc2.start(audioCtx.currentTime);
                    osc2.stop(audioCtx.currentTime + 0.5);
                }, 120);
            } catch (e) { console.log('音效不可用'); }
        }

        // ============ 登录 ============
        const loginSection = document.getElementById('login-section');
        const appLayout = document.getElementById('app-layout');
        const studentIdInput = document.getElementById('student-id');
        const studentNameInput = document.getElementById('student-name');
        const studentGroupInput = document.getElementById('student-group');
        const loginError = document.getElementById('login-error');
        const btnLogin = document.getElementById('btn-login');
        const sidebarUserName = document.getElementById('sidebar-user-name');
        const sidebarUserId = document.getElementById('sidebar-user-id');
        const sidebarUserGroup = document.getElementById('sidebar-user-group');

        btnLogin.addEventListener('click', function() {
            const id = studentIdInput.value.trim();
            const name = studentNameInput.value.trim();
            const group = studentGroupInput.value.trim();
            if (!id || !name || !group) { loginError.textContent = '请输入学号、姓名和小组'; return; }
            localStorage.setItem('studentId', id);
            localStorage.setItem('studentName', name);
            localStorage.setItem('studentGroup', group);
            loginSection.classList.add('hidden');
            appLayout.style.display = 'flex';
            sidebarUserName.textContent = name;
            sidebarUserId.textContent = '学号：' + id;
            sidebarUserGroup.textContent = '小组：' + group;
            // 登录成功发送学生基本信息
            sendDataToServer({
                type: 'login',
                studentId: id,
                studentName: name,
                studentGroup: group,
                timestamp: new Date().toISOString()
            });
            initMainApp();
        });

        const savedId = localStorage.getItem('studentId');
        const savedName = localStorage.getItem('studentName');
        const savedGroup = localStorage.getItem('studentGroup');
        if (savedId && savedName && savedGroup) {
            loginSection.classList.add('hidden');
            appLayout.style.display = 'flex';
            sidebarUserName.textContent = savedName;
            sidebarUserId.textContent = '学号：' + savedId;
            sidebarUserGroup.textContent = '小组：' + savedGroup;
            // 自动登录也发送学生基本信息
            sendDataToServer({
                type: 'login',
                studentId: savedId,
                studentName: savedName,
                studentGroup: savedGroup,
                timestamp: new Date().toISOString()
            });
            initMainApp();
        }

        function initMainApp() {
            function formatTime(seconds) {
                seconds = Math.floor(seconds);
                if (seconds < 60) return seconds + ' 秒';
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                if (mins < 60) return mins + ' 分 ' + secs + ' 秒';
                return Math.floor(mins / 60) + ' 小时 ' + (mins % 60) + ' 分';
            }

            function loadData() {
                try { const s = localStorage.getItem(STORAGE_KEY_PROGRESS); if (s) learnedTheories = new Set(JSON.parse(s).map(Number)); } catch (e) {}
                try { const s = localStorage.getItem(STORAGE_KEY_NOTES); if (s) notes = JSON.parse(s); } catch (e) { notes = {}; }
                try { const s = localStorage.getItem(STORAGE_KEY_STUDY_TIME); if (s) studyTimes = JSON.parse(s); } catch (e) { studyTimes = {}; }
                theoriesData.forEach(t => { if (!studyTimes[t.id]) studyTimes[t.id] = 0; });
                try { const s = localStorage.getItem(STORAGE_KEY_PARTICLES); if (s !== null) particlesEnabled = s === 'true'; } catch (e) {}
                if (!particlesEnabled) document.getElementById('particles-container').classList.add('hidden');
                try { const s = localStorage.getItem(STORAGE_KEY_LEADERBOARD); if (s) leaderboardScores = JSON.parse(s); } catch (e) { leaderboardScores = []; }
            }

            function saveProgress() { localStorage.setItem(STORAGE_KEY_PROGRESS, JSON.stringify([...learnedTheories])); }
            function saveNotes() { localStorage.setItem(STORAGE_KEY_NOTES, JSON.stringify(notes)); }
            function saveStudyTimes() { localStorage.setItem(STORAGE_KEY_STUDY_TIME, JSON.stringify(studyTimes)); }
            function saveLeaderboard() { localStorage.setItem(STORAGE_KEY_LEADERBOARD, JSON.stringify(leaderboardScores)); }

            function updateProgressUI() {
                const total = theoriesData.length;
                const learnedCount = learnedTheories.size;
                const percent = total > 0 ? Math.round((learnedCount / total) * 100) : 0;
                document.getElementById('navbar-learned-count').textContent = learnedCount;
                document.getElementById('navbar-progress-fill').style.width = percent + '%';
                document.getElementById('stat-learned').textContent = learnedCount;
                document.getElementById('stat-percent').textContent = percent + '%';
                const totalSeconds = Object.values(studyTimes).reduce((a, b) => a + (b || 0), 0);
                document.getElementById('stat-total-time').textContent = formatTime(totalSeconds);
                document.getElementById('final-learned').textContent = learnedCount;
                document.getElementById('final-total-time').textContent = formatTime(totalSeconds);
                document.getElementById('final-notes').textContent = Object.values(notes).filter(n => n && n.trim()).length;
                if (learnedCount === total && !hasShownCompletion) {
                    hasShownCompletion = true;
                    setTimeout(() => { document.getElementById('completion-overlay').classList.add('show'); document.getElementById('completion-banner').classList.add('show'); }, 500);
                }
            }

            function renderCards() {
                const cardsGrid = document.getElementById('cards-grid');
                cardsGrid.innerHTML = '';
                theoriesData.forEach((t, idx) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'card-wrapper';
                    wrapper.setAttribute('data-category', t.category);
                    wrapper.setAttribute('data-theory-id', t.id);
                    wrapper.setAttribute('data-search-text', t.searchText);
                    if (learnedTheories.has(t.id)) wrapper.classList.add('learned');
                    wrapper.innerHTML = `
                        <div class="card" role="button" tabindex="0">
                            <div class="card-front">
                                <div class="category-stripe"></div>
                                <span class="card-number">${String(idx + 1).padStart(2, '0')}</span>
                                <span class="card-category-badge">${t.category === 'distance' ? '远程教育' : t.category === 'learning' ? '学习理论' : t.category === 'instructional' ? '教学设计' : '社区对话'}</span>
                                <div class="card-icon">${t.icon}</div>
                                <h3 class="card-title">${t.title}</h3>
                                <p class="card-author">${t.author}</p>
                                <p class="card-tagline">${t.tagline}</p>
                                <div class="learned-badge">✓ 已学习</div>
                            </div>
                            <div class="card-back">
                                <div class="card-back-header"><span class="back-icon">${t.icon}</span><div><div class="back-title">${t.title}</div><div class="back-author">${t.author}</div></div></div>
                                <p class="card-back-description">${t.description}</p>
                                <div class="card-back-concepts">${t.concepts.map(c => `<span class="concept-tag">${c}</span>`).join('')}</div>
                                <p class="card-back-application">💡 <strong>应用：</strong>${t.application}</p>
                                <div class="card-back-study-time">⏱ 学习时长：<span class="study-time-display">${formatTime(studyTimes[t.id] || 0)}</span></div>
                                <button class="btn-view-detail" data-theory-id="${t.id}">📖 查看完整知识</button>
                                <button class="btn-mark-learned" data-theory-id="${t.id}" ${learnedTheories.has(t.id) ? 'disabled' : ''}>✓ 标记为已学习</button>
                                <div class="card-back-note"><textarea placeholder="写下你的学习笔记...">${notes[t.id] || ''}</textarea><button class="btn-save-note">保存笔记</button><span class="note-saved-indicator">已提交</span></div>
                            </div>
                        </div>
                    `;
                    cardsGrid.appendChild(wrapper);
                });
                bindCardEvents();
                applyFilterAndSearch();
            }

            function bindCardEvents() {
                document.querySelectorAll('.card-wrapper').forEach(wrapper => {
                    const card = wrapper.querySelector('.card');
                    const id = parseInt(wrapper.getAttribute('data-theory-id'));
                    card.addEventListener('click', function(e) {
                        if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON') return;
                        flipCard(card, id);
                    });
                    card.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON') return; flipCard(card, id); }
                    });
                    const textarea = wrapper.querySelector('textarea');
                    const saveBtn = wrapper.querySelector('.btn-save-note');
                    const indicator = wrapper.querySelector('.note-saved-indicator');
                    textarea.addEventListener('input', function() { notes[id] = textarea.value; saveNotes(); updateProgressUI(); });
                    saveBtn.addEventListener('click', function(e) { e.stopPropagation(); notes[id] = textarea.value; saveNotes(); indicator.classList.add('show'); setTimeout(() => indicator.classList.remove('show'), 1500); updateProgressUI(); });
                    const markBtn = wrapper.querySelector('.btn-mark-learned');
                    markBtn.addEventListener('click', function(e) { e.stopPropagation(); markAsLearned(id, wrapper, markBtn); });
                    const viewBtn = wrapper.querySelector('.btn-view-detail');
                    viewBtn.addEventListener('click', function(e) { e.stopPropagation(); openModal(id); });
                });
            }

            function flipCard(card, id) {
                const isFlipped = card.classList.contains('flipped');
                if (!isFlipped) {
                    lastFlipTimestamps[id] = Date.now();
                    const wrapper = card.closest('.card-wrapper');
                    if (wrapper) { const timeDisplay = wrapper.querySelector('.study-time-display'); if (timeDisplay) timeDisplay.textContent = '0 秒'; }
                } else {
                    if (lastFlipTimestamps[id]) { studyTimes[id] = (studyTimes[id] || 0) + (Date.now() - lastFlipTimestamps[id]) / 1000; lastFlipTimestamps[id] = null; saveStudyTimes(); const wrapper = card.closest('.card-wrapper'); if (wrapper) { const timeDisplay = wrapper.querySelector('.study-time-display'); if (timeDisplay) timeDisplay.textContent = formatTime(studyTimes[id] || 0); } }
                }
                card.classList.toggle('flipped');
                updateProgressUI();
            }

            function markAsLearned(id, wrapper, button) {
                if (learnedTheories.has(id)) return;
                if (lastFlipTimestamps[id]) { 
                    studyTimes[id] = (studyTimes[id] || 0) + (Date.now() - lastFlipTimestamps[id]) / 1000; 
                    lastFlipTimestamps[id] = null; 
                    saveStudyTimes(); 
                }
                learnedTheories.add(id); 
                saveProgress();
                wrapper.classList.add('learned'); 
                button.disabled = true; 
                button.textContent = '✓ 已学习';
                updateProgressUI();
                const timeDisplay = wrapper.querySelector('.study-time-display');
                if (timeDisplay) timeDisplay.textContent = formatTime(studyTimes[id] || 0);
                // 标记已学习时发送学习记录
                sendDataToServer({
                    type: 'study',
                    studentId: localStorage.getItem('studentId'),
                    theoryId: id,
                    studyTimeSeconds: Math.round(studyTimes[id] || 0),
                    timestamp: new Date().toISOString()
                });
            }

            window.addEventListener('beforeunload', function() {
                theoriesData.forEach(t => { 
                    if (lastFlipTimestamps[t.id]) { 
                        studyTimes[t.id] = (studyTimes[t.id] || 0) + (Date.now() - lastFlipTimestamps[t.id]) / 1000; 
                        lastFlipTimestamps[t.id] = null; 
                    } 
                });
                saveStudyTimes();
            });

            function applyFilterAndSearch() {
                document.querySelectorAll('.card-wrapper').forEach(w => {
                    const st = w.getAttribute('data-search-text') || '';
                    const ok = searchQuery === '' || st.toLowerCase().includes(searchQuery.toLowerCase());
                    w.classList.toggle('hidden-card', !ok);
                });
            }
            document.getElementById('search-input').addEventListener('input', function() { searchQuery = this.value.trim(); document.getElementById('search-clear').classList.toggle('visible', searchQuery !== ''); applyFilterAndSearch(); });
            document.getElementById('search-clear').addEventListener('click', function() { document.getElementById('search-input').value = ''; searchQuery = ''; this.classList.remove('visible'); applyFilterAndSearch(); });

            // ============ 模态框 ============
            const modalOverlay = document.getElementById('modal-overlay');
            const modalContent = document.getElementById('modal-content');
            function openModal(id) {
                const t = theoriesData.find(th => th.id === id);
                if (!t) return;
                modalContent.innerHTML = `
                    <button class="modal-close" id="modal-close">×</button>
                    <div class="modal-title">${t.icon} ${t.title}</div>
                    <div class="modal-author">${t.author}</div>
                    <div class="modal-section"><h3>理论核心观点</h3><p>${t.coreView}</p></div>
                    <div class="modal-section"><h3>提出者</h3><p>${t.proposer}</p></div>
                    <div class="modal-section"><h3>适用场景</h3><p>${t.scenarios}</p></div>
                    <div class="modal-section"><h3>学习测验</h3><div id="modal-quiz-container"></div></div>
                    <div class="modal-section"><h3>学习资源</h3>
                        <a class="modal-video-link" href="${t.videoUrl}" target="_blank">▶ 观看学习视频</a><br>
                        <a class="modal-video-link" href="${t.docUrl}" target="_blank">📄 查看学习文档</a>
                    </div>
                `;
                modalOverlay.classList.add('show');
                document.getElementById('modal-close').addEventListener('click', () => modalOverlay.classList.remove('show'));
                renderModalQuiz(t);
            }
            modalOverlay.addEventListener('click', function(e) { if (e.target === modalOverlay) modalOverlay.classList.remove('show'); });

            function renderModalQuiz(t) {
                const container = document.getElementById('modal-quiz-container');
                container.innerHTML = '';
                t.quiz.forEach((q, qi) => {
                    const qDiv = document.createElement('div');
                    qDiv.className = 'modal-quiz-question';
                    qDiv.innerHTML = `<div class="q-text">${qi + 1}. ${q.type === 'single' ? '[单选]' : q.type === 'multiple' ? '[多选]' : '[判断]'} ${q.question}</div>`;
                    const optionsDiv = document.createElement('div');
                    optionsDiv.className = 'modal-quiz-options';
                    if (q.type === 'single' || q.type === 'judge') {
                        q.options.forEach((opt, oi) => {
                            const optDiv = document.createElement('div');
                            optDiv.className = 'modal-quiz-option';
                            optDiv.textContent = opt;
                            optDiv.addEventListener('click', function() {
                                if (qDiv.dataset.answered === 'true') return;
                                qDiv.dataset.answered = 'true';
                                const isCorrect = (oi === q.answer);
                                if (isCorrect) {
                                    optDiv.classList.add('correct');
                                    playSuccessSound();
                                } else {
                                    optDiv.classList.add('wrong');
                                    const hint = document.createElement('div');
                                    hint.className = 'modal-quiz-feedback wrong';
                                    hint.textContent = q.hint || '回答错误';
                                    qDiv.appendChild(hint);
                                }
                            });
                            optionsDiv.appendChild(optDiv);
                        });
                    } else if (q.type === 'multiple') {
                        const selected = new Set();
                        q.options.forEach((opt, oi) => {
                            const optDiv = document.createElement('div');
                            optDiv.className = 'modal-quiz-option';
                            optDiv.textContent = opt;
                            optDiv.addEventListener('click', function() {
                                if (qDiv.dataset.answered === 'true') return;
                                if (selected.has(oi)) {
                                    selected.delete(oi);
                                    optDiv.classList.remove('selected');
                                } else {
                                    selected.add(oi);
                                    optDiv.classList.add('selected');
                                }
                            });
                            optionsDiv.appendChild(optDiv);
                        });
                        const submitBtn = document.createElement('button');
                        submitBtn.className = 'modal-quiz-submit';
                        submitBtn.textContent = '提交答案';
                        submitBtn.addEventListener('click', function() {
                            if (qDiv.dataset.answered === 'true') return;
                            qDiv.dataset.answered = 'true';
                            const correctAns = new Set(q.answer);
                            const isCorrect = selected.size === correctAns.size && [...selected].every(s => correctAns.has(s));
                            optionsDiv.querySelectorAll('.modal-quiz-option').forEach(optDiv => {
                                const idx = [...optionsDiv.children].indexOf(optDiv);
                                if (correctAns.has(idx)) optDiv.classList.add('correct');
                                else if (selected.has(idx)) optDiv.classList.add('wrong');
                            });
                            if (isCorrect) {
                                playSuccessSound();
                            } else {
                                const hint = document.createElement('div');
                                hint.className = 'modal-quiz-feedback wrong';
                                hint.textContent = q.hint || '回答错误';
                                qDiv.appendChild(hint);
                            }
                        });
                        qDiv.appendChild(submitBtn);
                    }
                    qDiv.appendChild(optionsDiv);
                    container.appendChild(qDiv);
                });
            }

            // 匹配挑战（拖拽+右侧记录）
            function renderMatchGame() {
                const mt = document.getElementById('match-theories');
                const ma = document.getElementById('match-authors');
                const recordList = document.getElementById('match-record-list');
                mt.innerHTML = ''; ma.innerHTML = ''; recordList.innerHTML = '<p style="text-align:center;color:var(--text-muted);font-size:.8rem;">暂无匹配</p>';
                matchScore = 0;
                document.getElementById('match-score').textContent = '匹配进度：0 / 9';
                const shuffledTheories = [...theoriesData].sort(() => Math.random() - 0.5);
                const shuffledAuthors = [...theoriesData].sort(() => Math.random() - 0.5);
                shuffledTheories.forEach(t => {
                    const d = document.createElement('div');
                    d.className = 'match-item';
                    d.setAttribute('draggable', 'true');
                    d.setAttribute('data-match-id', t.id);
                    d.setAttribute('data-match-type', 'theory');
                    d.textContent = `${t.icon} ${t.title}`;
                    d.addEventListener('dragstart', function(e) { e.dataTransfer.setData('text/plain', t.id); this.classList.add('selected'); });
                    d.addEventListener('dragend', function() { this.classList.remove('selected'); });
                    mt.appendChild(d);
                });
                shuffledAuthors.forEach(t => {
                    const d = document.createElement('div');
                    d.className = 'match-item';
                    d.setAttribute('data-match-id', t.id);
                    d.setAttribute('data-match-type', 'author');
                    d.textContent = t.author;
                    d.addEventListener('dragover', function(e) { e.preventDefault(); });
                    d.addEventListener('drop', function(e) {
                        e.preventDefault();
                        const draggedId = parseInt(e.dataTransfer.getData('text/plain'));
                        const targetId = parseInt(this.getAttribute('data-match-id'));
                        const theoryEl = document.querySelector(`.match-item[data-match-type="theory"][data-match-id="${draggedId}"]`);
                        if (draggedId === targetId) {
                            if (!this.classList.contains('matched') && !theoryEl.classList.contains('matched')) {
                                this.classList.add('matched'); theoryEl.classList.add('matched');
                                matchScore++;
                                document.getElementById('match-score').textContent = `匹配进度：${matchScore} / 9`;
                                // 添加记录
                                const recordItem = document.createElement('div');
                                recordItem.className = 'match-record-item';
                                recordItem.innerHTML = `<span class="theory">${theoryEl.textContent}</span><span class="author">${this.textContent}</span>`;
                                if (recordList.querySelector('p')) recordList.innerHTML = '';
                                recordList.appendChild(recordItem);
                                if (matchScore === 9) setTimeout(() => alert('🎉 完美匹配！'), 300);
                            }
                        } else {
                            this.classList.add('wrong'); theoryEl.classList.add('wrong');
                            setTimeout(() => { this.classList.remove('wrong'); theoryEl.classList.remove('wrong'); }, 600);
                        }
                    });
                    ma.appendChild(d);
                });
            }
            document.getElementById('match-reset').addEventListener('click', renderMatchGame);

            // 知识测验（10道）
            const selectedQuizQuestions = [
                { q: '交互影响距离理论的三个核心变量是？', options: ['对话、结构、自主性', '互动、内容、评价', '时间、地点、技术', '动机、策略、反馈'], answer: 0, hint: '关注师生互动和课程设计。' },
                { q: '联通主义认为知识存在于哪里？', options: ['个体头脑中', '网络连接中', '教科书中', '教师经验中'], answer: 1, hint: '知识是动态分散的。' },
                { q: 'ADDIE模型包含几个阶段？', options: ['3个', '4个', '5个', '6个'], answer: 2, hint: '每个字母代表一个阶段。' },
                { q: '认知负荷理论关注哪种记忆？', options: ['长期记忆', '工作记忆', '感觉记忆', '语义记忆'], answer: 1, hint: '一次处理的信息量有限。' },
                { q: '探究社区模型不包括哪种存在？', options: ['认知存在', '社会存在', '教学存在', '情感存在'], answer: 3, hint: '三种存在都直接相关。' },
                { q: '远程交互模型是谁提出的？', options: ['陈丽', '穆尔', '基更', '加里森'], answer: 0, hint: '中国远程教育学者。' },
                { q: '学习对话框架强调学习是什么？', options: ['对话', '记忆', '模仿', '训练'], answer: 0, hint: '多种交流互动。' },
                { q: '教与学再度整合主要解决什么？', options: ['时空分离', '内容过多', '动机不足', '设备落后'], answer: 0, hint: '远程教育最大挑战。' },
                { q: '首要教学原理的中心是什么？', options: ['真实问题', '技术工具', '教师讲授', '学习目标'], answer: 0, hint: '围绕问题展开设计。' },
                { q: '探究社区中教学存在的作用？', options: ['提供社交空间', '设计和引导学习', '营造情感氛围', '提供技术平台'], answer: 1, hint: '关注学习设计和指导。' }
            ];

            function renderQuiz() {
                const container = document.getElementById('quiz-container');
                const resultEl = document.getElementById('quiz-result');
                const resetBtn = document.getElementById('quiz-reset');
                container.innerHTML = ''; resultEl.style.display = 'none'; resetBtn.style.display = 'none';
                quizAttempts = {}; quizScore = 0; quizTotal = selectedQuizQuestions.length;
                selectedQuizQuestions.forEach((q, qi) => {
                    quizAttempts[qi] = { attempted: false, firstCorrect: false, score: 0 };
                    const div = document.createElement('div');
                    div.className = 'quiz-question';
                    div.setAttribute('data-quiz-id', qi);
                    div.innerHTML = `<div class="quiz-question-header"><span class="quiz-question-number">${qi + 1}</span>${q.q}</div>`;
                    const optionsDiv = document.createElement('div');
                    optionsDiv.className = 'quiz-options';
                    q.options.forEach((opt, oi) => {
                        const btn = document.createElement('button');
                        btn.className = 'quiz-option';
                        btn.textContent = opt;
                        btn.addEventListener('click', () => handleQuizAnswer(qi, oi, q.answer, q.hint, btn, div));
                        optionsDiv.appendChild(btn);
                    });
                    div.appendChild(optionsDiv);
                    const hintEl = document.createElement('div');
                    hintEl.className = 'quiz-hint'; hintEl.textContent = q.hint;
                    div.appendChild(hintEl);
                    container.appendChild(div);
                });
            }

            function handleQuizAnswer(qi, selected, correct, hintText, btn, qDiv) {
                const attempt = quizAttempts[qi];
                if (attempt.firstCorrect) return;
                if (!attempt.attempted) {
                    attempt.attempted = true;
                    if (selected === correct) {
                        attempt.firstCorrect = true; attempt.score = 2; quizScore += 2;
                        btn.classList.add('correct');
                        qDiv.querySelectorAll('.quiz-option').forEach(opt => opt.classList.add('disabled'));
                        const hintEl = qDiv.querySelector('.quiz-hint'); if (hintEl) hintEl.classList.remove('show');
                    } else {
                        attempt.firstCorrect = false; attempt.score = 0;
                        btn.classList.add('wrong');
                        const hintEl = qDiv.querySelector('.quiz-hint'); if (hintEl) hintEl.classList.add('show');
                    }
                } else {
                    if (selected === correct) {
                        qDiv.querySelectorAll('.quiz-option').forEach(opt => { opt.classList.remove('wrong'); opt.classList.add('disabled'); });
                        btn.classList.add('correct');
                        const hintEl = qDiv.querySelector('.quiz-hint'); if (hintEl) hintEl.classList.remove('show');
                    } else {
                        qDiv.querySelectorAll('.quiz-option').forEach(opt => opt.classList.remove('wrong'));
                        btn.classList.add('wrong');
                        const hintEl = qDiv.querySelector('.quiz-hint'); if (hintEl) hintEl.classList.add('show');
                    }
                }
                const allAttempted = Object.values(quizAttempts).every(a => a.attempted);
                if (allAttempted) {
                    const resultEl = document.getElementById('quiz-result');
                    const resetBtn = document.getElementById('quiz-reset');
                    const maxScore = quizTotal * 2;
                    let comment = quizScore === maxScore ? '🌟 完美！你对远程教育理论掌握得非常扎实！' : quizScore >= 16 ? '👏 优秀！继续保持！' : quizScore >= 12 ? '👍 良好！再复习一下会更好！' : quizScore >= 8 ? '📖 继续加油！建议回顾卡片内容。' : '💪 需要更多学习，建议重新阅读理论卡片。';
                    resultEl.textContent = `🏆 得分：${quizScore} / ${maxScore} 分 | ${comment}`;
                    resultEl.style.display = 'block';
                    resetBtn.style.display = 'block';
                    const studentName = localStorage.getItem('studentName') || '匿名';
                    const studentId = localStorage.getItem('studentId') || '';
                    leaderboardScores.push({ name: studentName, id: studentId, score: quizScore, max: maxScore, date: new Date().toLocaleString() });
                    if (leaderboardScores.length > 20) leaderboardScores = leaderboardScores.slice(-20);
                    saveLeaderboard(); renderLeaderboard();
                    // 完成知识测验后发送成绩
                    sendDataToServer({
                        type: 'quiz',
                        studentId: localStorage.getItem('studentId'),
                        score: quizScore,
                        total: maxScore,
                        timestamp: new Date().toISOString()
                    });
                }
            }

            document.getElementById('quiz-reset').addEventListener('click', renderQuiz);

            function renderLeaderboard() {
                const lb = document.getElementById('leaderboard');
                if (!lb) return;
                if (leaderboardScores.length === 0) { lb.innerHTML = '<h3>🏆 排行榜</h3><p style="text-align:center;color:var(--text-muted);font-size:.8rem;">暂无记录</p>'; return; }
                const sorted = [...leaderboardScores].sort((a, b) => (b.score / b.max) - (a.score / a.max) || b.score - a.score);
                let html = '<h3>🏆 排行榜</h3>';
                sorted.forEach((item, i) => {
                    const percent = item.max > 0 ? Math.round((item.score / item.max) * 100) : 0;
                    html += `<div class="leaderboard-item"><div class="rank">${i + 1}</div><div style="flex:1;margin-left:8px;"><div style="font-weight:600;">${item.name} (${item.id})</div><div class="detail">${item.date}</div></div><div class="score">${item.score}/${item.max} (${percent}%)</div></div>`;
                });
                lb.innerHTML = html;
            }

            // 时间线
            function renderTimeline() {
                const wrapper = document.getElementById('timeline-horizontal-wrapper');
                wrapper.innerHTML = '';
                const container = document.createElement('div');
                container.className = 'timeline-svg-container';
                const svgNS = 'http://www.w3.org/2000/svg';
                const svg = document.createElementNS(svgNS, 'svg');
                svg.setAttribute('class', 'timeline-svg');
                svg.setAttribute('viewBox', '0 0 1200 480');
                const path = document.createElementNS(svgNS, 'path');
                path.setAttribute('d', 'M 50 240 C 200 50, 400 430, 600 240 C 800 50, 1000 430, 1150 240');
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke', 'rgba(74,158,255,0.5)');
                path.setAttribute('stroke-width', '3');
                path.setAttribute('stroke-dasharray', '8 4');
                svg.appendChild(path);
                container.appendChild(svg);
                const years = ['1972','1975','1986','1988','2000','2002','2004','2005','2002'];
                const titles = ['交互影响距离理论','ADDIE模型','教与学再度整合','认知负荷理论','探究社区理论模型','首要教学原理','远程交互模型','联通主义学习理论','学习对话框架'];
                const authors = ['迈克尔·穆尔','佛罗里达州立大学','德斯蒙德·基更','约翰·斯威勒','兰迪·加里森','戴维·梅里尔','陈丽','乔治·西蒙斯','戴安娜·罗瑞兰德'];
                const details = ['对话、结构与自主性三个变量决定交互距离。','分析、设计、开发、实施、评估五阶段循环迭代。','远程教育的核心挑战是教与学的时空分离。','工作记忆有限，减少外在负荷。','认知、社会、教学三种存在共同支撑。','以问题为中心的五阶段教学。','操作、信息、概念交互三层次递进。','学习发生在网络连接之中。','学习是一种对话过程。'];
                const total = years.length;
                const startX = 50, endX = 1150;
                const step = (endX - startX) / (total - 1);
                years.forEach((year, i) => {
                    const x = startX + i * step;
                    const tParam = i / (total - 1);
                    const y = 240 + 170 * Math.sin(tParam * Math.PI * 2);
                    const node = document.createElement('div');
                    node.className = 'timeline-node-item';
                    node.style.left = x + 'px';
                    node.style.top = y + 'px';
                    node.innerHTML = `<div class="timeline-node-dot"></div><div class="timeline-node-label"><span class="year">${year}</span> ${titles[i]}<br><span style="font-size:.65rem;color:var(--text-muted);">${authors[i]}</span><div class="timeline-node-detail">${details[i]}</div></div>`;
                    node.addEventListener('click', function() { this.classList.toggle('expanded'); });
                    container.appendChild(node);
                });
                wrapper.appendChild(container);
            }

            // 导航
            document.querySelectorAll('.sidebar-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const panel = this.getAttribute('data-panel');
                    if (panel === 'random') { randomReview(); return; }
                    switchPanel(panel);
                });
            });
            function switchPanel(panel) {
                currentPanel = panel;
                document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
                document.querySelector(`.sidebar-btn[data-panel="${panel}"]`).classList.add('active');
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                document.getElementById('panel-' + panel).classList.add('active');
                const titles = { cards: '📚 理论卡片', match: '🧩 匹配挑战', quiz: '📝 知识测验', timeline: '📅 时间线' };
                document.getElementById('main-title').textContent = titles[panel] || '📚 理论卡片';
                if (panel === 'match') renderMatchGame();
                if (panel === 'quiz') { renderQuiz(); renderLeaderboard(); }
                if (panel === 'timeline') renderTimeline();
            }
            function randomReview() {
                const unlearned = theoriesData.filter(t => !learnedTheories.has(t.id));
                if (unlearned.length === 0) { alert('🎉 所有理论都已学习完毕！'); return; }
                const t = unlearned[Math.floor(Math.random() * unlearned.length)];
                switchPanel('cards');
                const wrapper = document.querySelector(`.card-wrapper[data-theory-id="${t.id}"]`);
                if (wrapper) { const card = wrapper.querySelector('.card'); if (!card.classList.contains('flipped')) { card.classList.add('flipped'); if (!lastFlipTimestamps[t.id]) lastFlipTimestamps[t.id] = Date.now(); } wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
            }
            document.getElementById('btn-random-sidebar').addEventListener('click', randomReview);
            document.getElementById('btn-particle-toggle').addEventListener('click', function() {
                particlesEnabled = !particlesEnabled;
                document.getElementById('particles-container').classList.toggle('hidden', !particlesEnabled);
                localStorage.setItem(STORAGE_KEY_PARTICLES, particlesEnabled ? 'true' : 'false');
                this.classList.toggle('active', !particlesEnabled);
                this.textContent = particlesEnabled ? '✨ 粒子' : '🌫️ 粒子';
            });
            document.getElementById('btn-reset-nav').addEventListener('click', function() {
                if (confirm('确定要重置所有学习进度、笔记和时长统计吗？')) {
                    learnedTheories.clear(); notes = {}; studyTimes = {};
                    theoriesData.forEach(t => { studyTimes[t.id] = 0; lastFlipTimestamps[t.id] = Date.now(); });
                    saveProgress(); saveNotes(); saveStudyTimes(); hasShownCompletion = false; renderCards(); updateProgressUI();
                }
            });
            document.getElementById('btn-close-banner').addEventListener('click', function() { document.getElementById('completion-overlay').classList.remove('show'); document.getElementById('completion-banner').classList.remove('show'); });
            document.getElementById('completion-overlay').addEventListener('click', function() { this.classList.remove('show'); document.getElementById('completion-banner').classList.remove('show'); });

            loadData(); renderCards(); updateProgressUI();
            if (learnedTheories.size === theoriesData.length) hasShownCompletion = true;
            switchPanel('cards');
        }
    </script>
</body>
</html>
